name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          test -s "docs/releases/$RELEASE_TAG.md"
          git diff --exit-code -- wipecord.user.js
          sha256sum wipecord.user.js LICENSE > SHA256SUMS
          (cd dist && sha256sum wipecord-*.zip) >> SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" wipecord.user.js dist/wipecord-*.zip LICENSE SHA256SUMS --verify-tag --title "Wipecord $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
